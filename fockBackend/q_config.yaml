misc:
  random_seed: 0
  folder_tag: "Q"                             # Additional folder name tag (can leave blank)
  scan_id: null
  scan_index: null
  scan_keys: null
  scan_params: {}

circuit:
  wires: 4                                    # Reduced from 8 to 4 for memory scaling
  dims : 4                                     # Reduced from 8 to 4 for memory scaling
  bs_substrate_type: "trainable_ring"          # Options: trainable_ + (ring, star, chain, alltoall, int)
  lg_substrate_type: drs                       # Options: null, d, s, r...one letter max of each, any order, any combination
  layers: 1                                   # Layers of BS substrate + local gate
  layer_structure: ["bs","lg","bs"] # CAREFUL UNSUP VS SUP! Options: bs, lg, cx
  reupload: False                             # ONLY USED IF SUPERVISED - whether layers include data encoding
  trash_modes: [1,2,3]                        # Adjusted to fit 4 wires

training:
  epochs: 400                                 # Maximum cutoff
  lr_start: 2e-2                              # Starting LR
  lr_patience: 5                              # Number of non-improving validation's before reducing LR via scheduler (no.epochs = lr_patience x val_every)
  es_patience: 15                             # Number of non-improving validation's before early stopping (no.epochs = es_patience x val_every)
  min_delta: 0.001                            # Minimum validation improvement required
  val_every: 2                                # Validate every X epochs
  lr_scheduling: True 
  batch_size: 16                              # Reduced batch size for sequential QNode looping
  opt_weight_decay: 0.0                       # Optimiser weight decay
  loss_fn: "F"                                # Options: F (+BCE), logF (+BCEWLL), logF/n (+BCEWLL) - loss_func (+supervised additional function)
  shuffle_particles: False

data:
  train_num_samples: 10000
  val_num_samples: 10000
  test_num_samples: 10000
  save_path: null                             # Set in config.py to avoid hardcoding